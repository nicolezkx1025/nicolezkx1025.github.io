<rect width="1180" height="900" fill="#ffffff"/>
<text x="96" y="40" font-size="22" font-weight="700" fill="#1a1a1a">方向地图:我做过什么,以及往哪里走</text>
<text x="96" y="64" font-size="12.5" fill="#666">横轴 = 可验证性(左:离线指标清晰 · 右:只能靠真实盈亏验证)　纵轴 = 与物理世界的耦合(下:纯数字 · 上:具身/实时系统)</text>
<text x="96" y="90" font-size="13" font-weight="600" fill="#c0392b">主线:低信噪比与退化条件下的可信系统 —— 状态估计 / 不确定性 / 评测闭环,能力可迁移至无人系统与量化研究。</text>
<text x="96" y="128" font-size="11.5" fill="#666">● 已有公开产出 10 个　◐ 真实做过的经验 14 个(生产/实验,未公开)　○ 尚未进入 8 个　虚线箭头 = 能力可迁移方向(意图,非战绩)</text>
<text x="96" y="150" font-size="11.5" fill="#666">红点 = 我的位置(按公开产出 + 生产经验 + 可迁移能力综合定位)　类别:</text>
<circle cx="497.8" cy="146" r="5.5" fill="#2f6fb0"/>
<text x="507.8" y="150" font-size="11.5" fill="#444">AI·数字</text>
<circle cx="576.1" cy="146" r="5.5" fill="#2e8b57"/>
<text x="586.1" y="150" font-size="11.5" fill="#444">AI·具身</text>
<circle cx="654.4" cy="146" r="5.5" fill="#8e44ad"/>
<text x="664.4" y="150" font-size="11.5" fill="#444">金融</text>
<text x="1140" y="884" font-size="11" fill="#aaa" text-anchor="end">圆心 = 该方向;● 实心 = 有公开产出　◐ 半亮 = 做过但没公开　○ 淡圈 = 还没进入。坐标为定性定位,远近是位置不是评分</text>
